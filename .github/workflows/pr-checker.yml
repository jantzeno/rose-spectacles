name: Pr Checker

on:
    pull_request:
        types: [edited, synchronize, opened, reopened]

permissions:
    contents: read
    pull-requests: write

jobs:
    pr-open-check:
        permissions:
            issues: write
            pull-requests: write
        runs-on: ubuntu-latest
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 20

            - name: Install packages
              run: bun install --frozen-lockfile

            # - name: Code Format
            #   id: codeFormat
            #   run: |
            #       bun run format:check

            - name: Unit Test
              id: unitTest
              run: |
                  bun run test:unit

            - name: Typecheck
              run: |
                  bun run typecheck

            - name: Security
              run: |
                  bun run security:check

            # - name: Add Code Format Fail Comment
            #   if: always() && steps.codeFormat.outcome == 'failure'
            #   uses: thollander/actions-comment-pull-request@8a3fad13c20088e9eb0805666b9fe49509d2fec8 # v1
            #   with:
            #       message: |
            #           Thanks a lot for your contribution! But, PR does not seem to fit our code format standards. Please run the 'bun run format' command and commit the changes.

            - name: Add Unit Test Fail Comment
              if: always() && steps.unitTest.outcome == 'failure'
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: "Thanks a lot for your contribution! But, Unit tests failed. You can check the unit tests with the command 'bun run test:unit' and commit the changes."
                      });

